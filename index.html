<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Monthly Expense Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;

            /* Background Image */
            background:
                linear-gradient(
                    rgba(0, 0, 0, 0.55),
                    rgba(0, 0, 0, 0.55)
                ),
                url("https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?auto=format&fit=crop&w=1600&q=80");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            min-height: 100vh;
        }


        /* ================= HEADER ================= */

        header {
            text-align: center;
            color: white;
            padding: 35px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 40px;
        }

        header p {
            font-size: 18px;
        }


        /* ================= CONTAINER ================= */

        .container {
            width: 92%;
            max-width: 1100px;
            margin: auto;
        }


        /* ================= SUMMARY ================= */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            padding: 20px;
            border-radius: 15px;
            text-align: center;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .card h3 {
            color: #666;
        }

        .card p {
            font-size: 28px;
            font-weight: bold;
        }

        .income {
            border-top: 6px solid #00b894;
        }

        .expense {
            border-top: 6px solid #e74c3c;
        }

        .balance {
            border-top: 6px solid #0984e3;
        }


        /* ================= MAIN ================= */

        .main {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 25px;
            margin-bottom: 40px;
        }

        .box {
            background: rgba(255, 255, 255, 0.96);
            padding: 25px;
            border-radius: 15px;

            box-shadow:
                0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .box h2 {
            margin-top: 0;
            color: #333;
        }


        /* ================= FORM ================= */

        label {
            display: block;
            font-weight: bold;
            margin-top: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 15px;

            border: none;
            border-radius: 8px;

            background: #6c5ce7;
            color: white;

            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #4834d4;
        }


        /* ================= SEARCH ================= */

        .search {
            margin-bottom: 15px;
        }


        /* ================= TABLE ================= */

        .table-container {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background: #6c5ce7;
            color: white;
        }

        .delete-btn {
            background: #e74c3c;
            width: auto;
            padding: 7px 12px;
            margin: 0;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #c0392b;
        }

        .empty {
            text-align: center;
            color: #777;
            padding: 25px;
        }


        /* ================= FOOTER ================= */

        footer {
            text-align: center;
            color: white;
            padding: 20px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

            .main {
                grid-template-columns: 1fr;
            }

            header h1 {
                font-size: 28px;
            }
        }

    </style>
</head>


<body>


    <!-- ================= HEADER ================= -->

    <header>

        <h1>💰 Monthly Expense Tracker</h1>

        <p>
            Track your money • Control your spending
        </p>

    </header>



    <div class="container">


        <!-- ================= SUMMARY ================= -->

        <div class="cards">


            <div class="card income">

                <h3>💵 Monthly Income</h3>

                <p>
                    ₹<span id="incomeDisplay">0</span>
                </p>

            </div>


            <div class="card expense">

                <h3>💸 Total Expenses</h3>

                <p>
                    ₹<span id="expenseDisplay">0</span>
                </p>

            </div>


            <div class="card balance">

                <h3>💰 Remaining Balance</h3>

                <p>
                    ₹<span id="balanceDisplay">0</span>
                </p>

            </div>


        </div>



        <!-- ================= MAIN ================= -->

        <div class="main">


            <!-- ================= LEFT FORM ================= -->

            <div class="box">


                <h2>💵 Income</h2>


                <label>
                    Monthly Income
                </label>


                <input
                    type="number"
                    id="incomeInput"
                    placeholder="Enter income"
                >


                <button onclick="saveIncome()">
                    Save Income
                </button>



                <h2 style="margin-top:30px;">
                    ➕ Add Expense
                </h2>


                <label>
                    Expense Name
                </label>


                <input
                    type="text"
                    id="expenseName"
                    placeholder="Example: Food"
                >


                <label>
                    Category
                </label>


                <select id="category">

                    <option value="Food">
                        🍔 Food
                    </option>

                    <option value="Travel">
                        🚗 Travel
                    </option>

                    <option value="Shopping">
                        🛍️ Shopping
                    </option>

                    <option value="Bills">
                        💡 Bills
                    </option>

                    <option value="Education">
                        📚 Education
                    </option>

                    <option value="Health">
                        🏥 Health
                    </option>

                    <option value="Other">
                        📦 Other
                    </option>

                </select>


                <label>
                    Date
                </label>


                <input
                    type="date"
                    id="expenseDate"
                >


                <label>
                    Amount
                </label>


                <input
                    type="number"
                    id="expenseAmount"
                    placeholder="Enter amount"
                >


                <button onclick="addExpense()">
                    ➕ Add Expense
                </button>


            </div>



            <!-- ================= EXPENSE LIST ================= -->

            <div class="box">


                <h2>
                    📋 Expense History
                </h2>


                <input
                    class="search"
                    type="text"
                    id="search"
                    placeholder="🔍 Search expense..."
                    onkeyup="displayExpenses()"
                >


                <div class="table-container">


                    <table>


                        <thead>

                            <tr>

                                <th>Date</th>

                                <th>Name</th>

                                <th>Category</th>

                                <th>Amount</th>

                                <th>Action</th>

                            </tr>

                        </thead>


                        <tbody id="expenseList">

                        </tbody>


                    </table>


                </div>


            </div>


        </div>


    </div>



    <!-- ================= FOOTER ================= -->

    <footer>

        © 2026 Monthly Expense Tracker

    </footer>



    <!-- ================= JAVASCRIPT ================= -->

    <script>


        // Load income from browser

        let income =
            Number(
                localStorage.getItem("income")
            ) || 0;



        // Load expenses from browser

        let expenses =
            JSON.parse(
                localStorage.getItem("expenses")
            ) || [];



        // Set today's date

        document.getElementById(
            "expenseDate"
        ).value =
            new Date()
                .toISOString()
                .split("T")[0];



        // ================= SAVE INCOME =================

        function saveIncome() {


            let value =
                Number(
                    document.getElementById(
                        "incomeInput"
                    ).value
                );


            if (value <= 0) {

                alert(
                    "Please enter a valid income."
                );

                return;
            }


            income = value;


            localStorage.setItem(
                "income",
                income
            );


            document.getElementById(
                "incomeInput"
            ).value = "";


            updateDashboard();


            alert(
                "Income saved successfully!"
            );

        }



        // ================= ADD EXPENSE =================

        function addExpense() {


            let name =
                document.getElementById(
                    "expenseName"
                ).value;


            let category =
                document.getElementById(
                    "category"
                ).value;


            let date =
                document.getElementById(
                    "expenseDate"
                ).value;


            let amount =
                Number(
                    document.getElementById(
                        "expenseAmount"
                    ).value
                );


            if (
                name === "" ||
                date === "" ||
                amount <= 0
            ) {

                alert(
                    "Please enter all expense details."
                );

                return;
            }


            let expense = {

                id: Date.now(),

                name: name,

                category: category,

                date: date,

                amount: amount

            };


            expenses.push(expense);


            localStorage.setItem(
                "expenses",
                JSON.stringify(expenses)
            );


            document.getElementById(
                "expenseName"
            ).value = "";


            document.getElementById(
                "expenseAmount"
            ).value = "";


            displayExpenses();

            updateDashboard();


            alert(
                "Expense added successfully!"
            );

        }



        // ================= DISPLAY EXPENSES =================

        function displayExpenses() {


            let list =
                document.getElementById(
                    "expenseList"
                );


            let search =
                document.getElementById(
                    "search"
                ).value.toLowerCase();


            list.innerHTML = "";


            let filtered =
                expenses.filter(
                    function(expense) {

                        return (

                            expense.name
                                .toLowerCase()
                                .includes(search)

                            ||

                            expense.category
                                .toLowerCase()
                                .includes(search)

                        );

                    }
                );


            if (filtered.length === 0) {

                list.innerHTML = `

                    <tr>

                        <td
                            colspan="5"
                            class="empty"
                        >
                            No expenses found
                        </td>

                    </tr>

                `;

                return;
            }



            // Sort newest date first

            filtered.sort(
                function(a, b) {

                    return (
                        new Date(b.date)
                        -
                        new Date(a.date)
                    );

                }
            );



            filtered.forEach(
                function(expense) {


                    list.innerHTML += `

                        <tr>

                            <td>
                                ${expense.date}
                            </td>

                            <td>
                                ${expense.name}
                            </td>

                            <td>
                                ${expense.category}
                            </td>

                            <td>
                                ₹${expense.amount}
                            </td>

                            <td>

                                <button
                                    class="delete-btn"
                                    onclick="deleteExpense(${expense.id})"
                                >
                                    🗑️ Delete
                                </button>

                            </td>

                        </tr>

                    `;

                }
            );

        }



        // ================= DELETE EXPENSE =================

        function deleteExpense(id) {


            if (
                !confirm(
                    "Are you sure you want to delete this expense?"
                )
            ) {

                return;
            }


            expenses =
                expenses.filter(
                    function(expense) {

                        return expense.id !== id;

                    }
                );


            localStorage.setItem(
                "expenses",
                JSON.stringify(expenses)
            );


            displayExpenses();

            updateDashboard();

        }



        // ================= DASHBOARD =================

        function updateDashboard() {


            let totalExpense =
                expenses.reduce(
                    function(total, expense) {

                        return (
                            total +
                            expense.amount
                        );

                    },
                    0
                );


            let balance =
                income - totalExpense;


            document.getElementById(
                "incomeDisplay"
            ).innerText =
                income;


            document.getElementById(
                "expenseDisplay"
            ).innerText =
                totalExpense;


            document.getElementById(
                "balanceDisplay"
            ).innerText =
                balance;

        }



        // ================= START =================

        displayExpenses();

        updateDashboard();


    </script>


</body>
</html>
